[project]
name = "qp_litebird"
version = "0.1.0"
description = "QuickPol beam matrices computation for LiteBIRD"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "healpy",
    "astropy",
    "litebird-sim",
    "h5py",
]
[dependency-groups]
notebooks = [
    "smarties[optional]",
    "ipykernel",
    "matplotlib",
    "ducc0",
]

[tool.uv.sources]
litebird-sim = { git = "https://github.com/litebird/litebird_sim" }
smarties = { git = "https://github.com/camilledemay/smarties-beam-convolution" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qp_litebird"]
